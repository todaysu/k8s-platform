# Prometheus + Alertmanager（含 node-exporter、kube-state-metrics）
#
# 面向 kind / 小型自建集群的轻量监控栈，不含 Operator 与 Grafana。
#
# 关键约定（与平台监控页的自动发现规则对齐）：
#   - namespace 名为 monitoring
#   - Prometheus Service 名为 prometheus，端口 9090 且端口名 web
#   - 平台扫描 Service 时按 "命名空间/名称/label 含 prometheus" + 端口判断，
#     该组合得分最高，因此无需额外配置即可被识别为数据源。
#
# 应用前先导入镜像（本地 docker 镜像不会自动进入 kind 节点）：
#   kind load docker-image quay.io/prometheus/prometheus:v3.11.1 --name <集群名>
#   ... 见 scripts/setup-monitoring.sh
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: ftc-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
# Prometheus 需要读节点指标、Service/Endpoint 做发现，并通过 nodes/proxy 访问 kubelet。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ftc-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "services", "endpoints", "pods", "configmaps"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ftc-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ftc-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      # 避免目标未就绪时打上大量失败标记，30s 足够及时发现。
      external_labels:
        cluster: ftc-manual-v1

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: alertmanager
        static_configs:
          - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]

      # node-exporter：主机 CPU/内存/磁盘/网络
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            regex: node-exporter;metrics
            action: keep

      # kube-state-metrics：Deployment/Pod/Node 等对象状态
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            regex: kube-state-metrics;http
            action: keep

      # kubelet cAdvisor：容器级 CPU/内存/文件系统指标。
      # 平台监控页的 Pod CPU/内存/磁盘面板依赖这里的 container_* 指标。
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __metrics_path__
            replacement: /metrics/cadvisor
          - source_labels: [__address__]
            regex: "([^:]+):.*"
            target_label: instance
            replacement: "$1"
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # kubelet 自身指标
      - job_name: kubelet
        scheme: https
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node

      # apiserver：平台「APIServer」面板依赖 apiserver_request_* / inflight。
      # 通过 kubernetes Service 的 Endpoint 发现，免去硬编码地址。
      - job_name: apiserver
        scheme: https
        tls_config:
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [default]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: kubernetes
            action: keep

      # etcd：kind 的 etcd 是静态 Pod，只监听本机回环与节点 IP。
      # 这里自动发现 control-plane 节点并把端口改写为 2379，
      # 避免集群重建后 IP 变化导致目标失效。
      # 证书由 Secret etcd-client-certs 提供，见 scripts/setup-monitoring.sh。
      - job_name: etcd
        scheme: https
        tls_config:
          ca_file: /etc/prometheus/etcd-certs/ca.crt
          cert_file: /etc/prometheus/etcd-certs/client.crt
          key_file: /etc/prometheus/etcd-certs/client.key
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            regex: .*-control-plane
            action: keep
          - source_labels: [__address__]
            regex: "([^:]+):.*"
            target_label: __address__
            replacement: "$1:2379"
---
# 基础告警规则。阈值偏保守，避免测试环境频繁抖动。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  platform-alerts.yml: |
    groups:
      - name: kubernetes-node
        rules:
          - alert: NodeDown
            expr: up{job="kubelet"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "节点不可达"
              description: "节点 {{ $labels.instance }} 的 kubelet 已 5 分钟无法抓取。"

          - alert: NodeHighCPU
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "节点 CPU 使用率过高"
              description: "节点 {{ $labels.instance }} CPU 使用率 {{ printf \"%.1f\" $value }}% 持续 10 分钟。"

          - alert: NodeLowMemory
            expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "节点可用内存不足"
              description: "节点 {{ $labels.instance }} 可用内存仅剩 {{ printf \"%.1f\" $value }}%。"

      - name: kubernetes-workload
        rules:
          - alert: PodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod 反复重启"
              description: "{{ $labels.namespace }}/{{ $labels.pod }} 在 15 分钟内重启超过 3 次。"

          - alert: PodNotReady
            expr: kube_pod_status_phase{phase=~"Pending|Unknown"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Pod 长时间未就绪"
              description: "{{ $labels.namespace }}/{{ $labels.pod }} 处于 {{ $labels.phase }} 超过 15 分钟。"

      - name: kubernetes-control-plane
        rules:
          - alert: APIServerHighLatency
            expr: histogram_quantile(0.99, sum by(verb,le) (rate(apiserver_request_duration_seconds_bucket{job="apiserver"}[5m]))) > 1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "APIServer 高延迟"
              description: "APIServer P99 延迟 {{ printf \"%.2f\" $value }}s，动词 {{ $labels.verb }}。"

          - alert: EtcdNoLeader
            expr: etcd_server_has_leader{job="etcd"} == 0
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "etcd 无 Leader"
              description: "etcd 实例 {{ $labels.instance }} 已 3 分钟没有 Leader。"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  # 单副本 + RWO 卷，滚动更新会因卷占用卡住，改用重建策略。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          # 本地已有该镜像，导入 kind 后 IfNotPresent 直接复用。
          image: quay.io/prometheus/prometheus:v3.11.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=8GB
            - --web.enable-lifecycle
            - --web.listen-address=:9090
          ports:
            - { name: web, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: web }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            - { name: etcd-certs, mountPath: /etc/prometheus/etcd-certs, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        # 证书由 scripts/setup-monitoring.sh 从 control-plane 节点导出后创建；
        # Secret 缺失时 Pod 会一直 ContainerCreating，先跑脚本再 apply。
        - name: etcd-certs
          secret:
            secretName: etcd-client-certs
            optional: true
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    # 端口名必须为 web 或 http、端口必须为 9090，平台据此识别 Prometheus。
    - { name: web, port: 9090, targetPort: web }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: monitoring
---
# 默认配置只做「收下告警并留痕」，不实际外发。
# 要接企业微信/钉钉/邮件，替换 receivers 里的 webhook_configs。
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      group_by: [alertname, namespace, instance]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: default
        # 未配置真实通知渠道时，告警只保存在 Alertmanager 中可查。
        # 示例（企业微信机器人）：
        # webhook_configs:
        #   - url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=<KEY>
        #     send_resolved: true

    inhibit_rules:
      - source_matchers: [severity="critical"]
        target_matchers: [severity="warning"]
        equal: [alertname, instance]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      serviceAccountName: alertmanager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.31.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
          ports:
            - { name: web, containerPort: 9093 }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml, readOnly: true }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: data
          persistentVolumeClaim: { claimName: alertmanager-data }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - { name: web, port: 9093, targetPort: web }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      # control-plane 节点带污点时也要采集，否则节点级面板缺一侧数据。
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.11.0
          imagePullPolicy: IfNotPresent
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
          ports:
            - { name: metrics, containerPort: 9100 }
          resources:
            requests: { cpu: 30m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: proc, mountPath: /host/proc, readOnly: true }
            - { name: sys, mountPath: /host/sys, readOnly: true }
            - { name: root, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer }
      volumes:
        - name: proc
          hostPath: { path: /proc }
        - name: sys
          hostPath: { path: /sys }
        - name: root
          hostPath: { path: / }
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: node-exporter
  ports:
    - { name: metrics, port: 9100, targetPort: metrics }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ftc-kube-state-metrics
rules:
  - apiGroups: [""]
    resources:
      ["configmaps", "secrets", "nodes", "pods", "services", "resourcequotas",
       "replicationcontrollers", "limitranges", "persistentvolumeclaims",
       "persistentvolumes", "namespaces", "endpoints"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets", "deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ftc-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ftc-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.18.0
          imagePullPolicy: IfNotPresent
          args:
            - --port=8080
            - --telemetry-port=8081
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - { name: http, port: 8080, targetPort: http }
