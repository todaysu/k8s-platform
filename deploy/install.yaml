# FTC Platform: ordinary Kubernetes, HTTPS NodePort, existing MySQL 8+.
# Generate a private data/delivery/install.yaml with: go run ./cmd/installer
# Edit the single image below, then: kubectl apply -f data/delivery/install.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: ftc-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: ftc-platform-bootstrap
  namespace: ftc-platform
type: Opaque
stringData:
  setup-token: REPLACE_WITH_SETUP_TOKEN
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ftc-platform
  namespace: ftc-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ftc-platform-setup
  namespace: ftc-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ftc-platform-certificates
  namespace: ftc-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ftc-platform-certificates
  namespace: ftc-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ftc-platform"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ftc-platform-ca", "ftc-platform-tls"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ftc-platform-certificates
  namespace: ftc-platform
subjects:
  - kind: ServiceAccount
    name: ftc-platform-certificates
    namespace: ftc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ftc-platform-certificates
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ftc-platform-runtime
  namespace: ftc-platform
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ftc-platform-runtime
  namespace: ftc-platform
subjects:
  - kind: ServiceAccount
    name: ftc-platform
    namespace: ftc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ftc-platform-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ftc-platform-setup
  namespace: ftc-platform
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "create", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    resourceNames: ["ftc-platform-setup"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ftc-platform-setup
  namespace: ftc-platform
subjects:
  - kind: ServiceAccount
    name: ftc-platform-setup
    namespace: ftc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ftc-platform-setup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ftc-platform-setup
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: ["ftc-platform-setup"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ftc-platform-setup
subjects:
  - kind: ServiceAccount
    name: ftc-platform-setup
    namespace: ftc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ftc-platform-setup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftc-platform-setup
  namespace: ftc-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ftc-platform-setup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ftc-platform-setup
    spec:
      serviceAccountName: ftc-platform-setup
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: REPLACE_WITH_PLATFORM_IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - name: SETUP_MODE
              value: "true"
            - name: LISTEN_ADDR
              value: ":8443"
            - name: HEALTH_ADDR
              value: ":8081"
            - name: WEB_DIST_DIR
              value: /app/web
            - name: SECURE_COOKIES
              value: "true"
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: SETUP_TOKEN
              valueFrom: { secretKeyRef: { name: ftc-platform-bootstrap, key: setup-token } }
          ports:
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ftc-platform-setup
  namespace: ftc-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ftc-platform-setup
  ports:
    - name: https
      port: 443
      targetPort: https
      nodePort: 30080
