apiVersion: v1
kind: Namespace
metadata:
  name: ftc-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ftc-platform
  namespace: ftc-platform
---
# Setup-only identity. It may read and write the runtime Secret and restart the
# platform Pods, and nothing else. No long-running role is bound to it, so the
# database DSN and the credential encryption key are never exposed through the
# API to a process that outlives initialization.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ftc-platform-setup
  namespace: ftc-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ftc-platform-leader-election
  namespace: ftc-platform
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Only the legacy single-Leader collector mode restarts Pods. Reads are served
  # from the platform database, and no long-running role needs Secret access:
  # every credential is injected through env/envFrom when the Pod starts.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # 参数配置保存后，通过更新 Pod template annotation 触发对应实例滚动重启。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ftc-platform-setup
  namespace: ftc-platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ftc-platform-leader-election
  namespace: ftc-platform
subjects:
  - kind: ServiceAccount
    name: ftc-platform
    namespace: ftc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ftc-platform-leader-election
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ftc-platform-setup
  namespace: ftc-platform
subjects:
  - kind: ServiceAccount
    name: ftc-platform-setup
    namespace: ftc-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ftc-platform-setup
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ftc-platform
  namespace: ftc-platform
data:
  LISTEN_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  SETUP_MODE: "true"
  SETUP_DEFAULT_DB_HOST: platform-mysql.ftc-platform.svc
  SETUP_DEFAULT_DB_NAME: ftc_platform
  SETUP_RUNTIME_SECRET: ftc-platform-runtime
  WEB_DIST_DIR: /app/web
  SECURE_COOKIES: "true"
  # WebSocket 跨端口 loopback 例外仅供本地前端联调，生产必须保持 "false"。
  ALLOW_LOOPBACK_WS_ORIGIN: "false"
  # 仅当平台位于可信 Ingress / 负载均衡之后且该头由代理写入时设为 "true"，
  # 否则登录限流可被伪造的 X-Forwarded-For 绕过。
  TRUST_PROXY_HEADERS: "false"
  SESSION_TTL: 8h
  ENABLE_POD_EXEC: "false"

  # ---------------------------------------------------------------------
  # 安全扫描镜像（kube-bench CIS 节点基线）
  # ---------------------------------------------------------------------
  # 平台会按被扫节点的架构选择镜像：amd64/arm64 各用一个。
  # 留空表示回退到 SECURITY_KUBE_BENCH_IMAGE，因此只有单架构集群时
  # 只需填第一项。
  #
  # 生产建议：把 kube-bench 镜像同步到企业镜像仓库（多架构 manifest），
  # 再分别填入下面两项，避免被纳管集群现场拉取外网镜像失败。
  #
  #   SECURITY_KUBE_BENCH_IMAGE        通用镜像（单架构集群 / 回退用）
  #   SECURITY_KUBE_BENCH_IMAGE_AMD64  x86_64 节点专用
  #   SECURITY_KUBE_BENCH_IMAGE_ARM64  aarch64 节点专用
  SECURITY_KUBE_BENCH_IMAGE: docker.io/aquasec/kube-bench:v0.16.0
  SECURITY_KUBE_BENCH_IMAGE_AMD64: ""
  SECURITY_KUBE_BENCH_IMAGE_ARM64: ""
  SECURITY_SCAN_WORKERS: "2"
  SECURITY_SCAN_TIMEOUT: 30m
  SECURITY_POD_STARTUP_TIMEOUT: 5m
  SECURITY_HOST_SCAN_WORKERS: "5"
  # 扫描 Job 建立在被纳管集群的哪个 namespace（该 namespace 需要允许建 Job）。
  SECURITY_SCANNER_NAMESPACE: kube-system
  # 私有仓库拉取凭据：填写被纳管集群中已存在的 imagePullSecret 名称。
  # 留空表示使用各节点的默认凭据（仅公共仓库可用）。
  SECURITY_SCANNER_IMAGE_PULL_SECRET: ""

  LEADER_ELECTION_ENABLED: "true"
  LEADER_ELECTION_NAME: ftc-platform-collectors
  HEALTH_COLLECTION_INTERVAL: 1m
  HEALTH_COLLECTION_TIMEOUT: 20s
  HEALTH_COLLECTION_WORKERS: "5"
  HEALTH_INSTANCE_SOURCE: workloads
  CAPACITY_COLLECTION_INTERVAL: 5m
  CAPACITY_COLLECTION_TIMEOUT: 45s
  CAPACITY_COLLECTION_WORKERS: "3"
  RESOURCE_INDEX_INTERVAL: 10m
  RESOURCE_INDEX_TIMEOUT: 30s
  RESOURCE_INDEX_WORKERS: "2"
  SYSTEM_NAMESPACES: kube-system,cmb-monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: ftc-platform
  namespace: ftc-platform
type: Opaque
stringData:
  # 上线前必须替换。encryption-key 必须是 32 字节密钥的 Base64；setup-token 用于首次初始化。
  encryption-key: REPLACE_WITH_BASE64_32_BYTE_KEY
  setup-token: REPLACE_WITH_SETUP_TOKEN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftc-platform
  namespace: ftc-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ftc-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ftc-platform
    spec:
      serviceAccountName: ftc-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: platform
          # 平台自身镜像：替换为企业镜像仓库地址。
          # 多架构集群请推送 manifest list，平台按节点架构自动选择。
          image: your-registry.example.com/ftc-platform:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: ftc-platform }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: PLATFORM_DATABASE_DSN
              valueFrom: { secretKeyRef: { name: ftc-platform-runtime, key: dsn, optional: true } }
            - name: ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: ftc-platform-runtime, key: admin-username, optional: true } }
            - name: ADMIN_PASSWORD_HASH
              valueFrom: { secretKeyRef: { name: ftc-platform-runtime, key: admin-password-hash, optional: true } }
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: ftc-platform, key: encryption-key } }
            - name: SETUP_TOKEN
              valueFrom: { secretKeyRef: { name: ftc-platform, key: setup-token } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /app/data }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ftc-platform
  namespace: ftc-platform
spec:
  selector:
    app.kubernetes.io/name: ftc-platform
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ftc-platform
  namespace: ftc-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ftc-platform

