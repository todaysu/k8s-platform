apiVersion: v1
kind: Secret
metadata:
  name: platform-mysql
  namespace: ftc-platform
type: Opaque
stringData:
  root-password: REPLACE_WITH_ROOT_PASSWORD
  username: ftc
  password: REPLACE_WITH_PASSWORD
  database: ftc_platform
---
apiVersion: v1
kind: Service
metadata:
  name: platform-mysql
  namespace: ftc-platform
spec:
  selector:
    app.kubernetes.io/name: platform-mysql
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-mysql
  namespace: ftc-platform
spec:
  serviceName: platform-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-mysql
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-mysql, key: root-password } }
            - name: MYSQL_DATABASE
              valueFrom: { secretKeyRef: { name: platform-mysql, key: database } }
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: platform-mysql, key: username } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-mysql, key: password } }
          ports:
            - { name: mysql, containerPort: 3306 }
          startupProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u$MYSQL_USER -p$MYSQL_PASSWORD"] }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u$MYSQL_USER -p$MYSQL_PASSWORD"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "4", memory: 4Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 100Gi }

