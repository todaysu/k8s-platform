# 单副本 MySQL，适用于开发、测试或可接受短时中断的小规模场景。
apiVersion: v1
kind: Secret
metadata:
  name: platform-mysql
  namespace: ftc-platform
type: Opaque
stringData:
  root-password: REPLACE_WITH_ROOT_PASSWORD
  username: ftc
  password: REPLACE_WITH_PASSWORD
  database: ftc_platform
---
apiVersion: v1
kind: Service
metadata:
  name: platform-mysql
  namespace: ftc-platform
spec:
  # NodePort 便于从集群外部直连数据库排查问题；
  # 端口须在 30000-32767 范围内，且不能与已有 NodePort 冲突。
  type: NodePort
  selector:
    app.kubernetes.io/name: platform-mysql
  ports:
    - { name: mysql, port: 3306, targetPort: mysql, nodePort: 32066 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-mysql
  namespace: ftc-platform
spec:
  serviceName: platform-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-mysql
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          # 镜像地址：替换为企业镜像仓库地址。
          # 多架构集群请推送 manifest list，StatefulSet 按节点架构自动选择。
          # 交付版高可用请使用 deploy/install.yaml（PXC Operator 三节点）；本清单仅用于本地开发。
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
            # 平台 DSN 使用 charset=utf8mb4 / parseTime=true / loc=UTC，
            # 字符集与时区必须与这里一致。
            - --default-time-zone=+00:00
            # 事件表按 100 次/秒写入，连接池上限需大于平台侧 20。
            - --max-connections=500
            - --innodb_buffer_pool_size=2G
            - --max_allowed_packet=64M
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-mysql, key: root-password } }
            - name: MYSQL_DATABASE
              valueFrom: { secretKeyRef: { name: platform-mysql, key: database } }
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: platform-mysql, key: username } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-mysql, key: password } }
          ports:
            - { name: mysql, containerPort: 3306 }
          startupProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u$MYSQL_USER -p$MYSQL_PASSWORD"] }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u$MYSQL_USER -p$MYSQL_PASSWORD"] }
            periodSeconds: 10
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "4", memory: 4Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 100Gi }

