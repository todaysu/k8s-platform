apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-mysql-backup
  namespace: ftc-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-mysql-backup
  namespace: ftc-platform
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: mysqldump
              # 镜像地址：替换为企业镜像仓库地址（与 MySQL 实例保持同版本）。
              image: mysql:8.4
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export MYSQL_PWD="$MYSQL_PASSWORD"
                  stamp="$(date -u +%Y%m%d%H%M%S)"
                  target="/backup/${MYSQL_DATABASE}-${stamp}.sql.gz"
                  mysqldump -h platform-mysql -u "$MYSQL_USER" \
                    --single-transaction --quick --routines --events --triggers \
                    "$MYSQL_DATABASE" | gzip > "$target"
                  find /backup -type f -name '*.sql.gz' -mtime +7 -delete
              env:
                - name: MYSQL_USER
                  value: root
                - name: MYSQL_PASSWORD
                  valueFrom: { secretKeyRef: { name: platform-mysql, key: root-password } }
                - name: MYSQL_DATABASE
                  valueFrom: { secretKeyRef: { name: platform-mysql, key: database } }
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: platform-mysql-backup }
