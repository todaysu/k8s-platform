# Opt-in collector role after shared MySQL setup; do not run alongside an all-role
# instance. Shard count is persisted: changing it requires a controlled migration.
# API instances must use PLATFORM_ROLE=api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftc-platform-collector
  namespace: ftc-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: ftc-platform-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ftc-platform-collector }
    spec:
      serviceAccountName: ftc-platform
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          # 平台自身镜像：替换为企业镜像仓库地址。
          # 多架构集群请推送 manifest list，平台按节点架构自动选择。
          image: your-registry.example.com/ftc-platform:0.1.0
          envFrom:
            - configMapRef: { name: ftc-platform }
          env:
            - { name: PLATFORM_ROLE, value: collector }
            - { name: COLLECTION_SHARDS, value: "16" }
            - { name: HEALTH_INSTANCE_SOURCE, value: workloads }
            - { name: SETUP_MODE, value: 'false' }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: PLATFORM_DATABASE_DSN
              valueFrom: { secretKeyRef: { name: ftc-platform-runtime, key: dsn } }
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: ftc-platform, key: encryption-key } }
          ports:
            - { name: health, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /readyz, port: health }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          resources:
            requests: { cpu: '2', memory: 2Gi }
            limits: { cpu: '4', memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
